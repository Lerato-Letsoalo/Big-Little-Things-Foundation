<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Big Little Things Foundation</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="header-mount"></div>

  <main class="container" style="padding-top:80px;padding-bottom:80px;">
    <div style="max-width:440px;margin:0 auto;">
      <h1 class="section-title" style="font-size:2rem;margin-bottom:8px;">Reset <em>Password</em></h1>
      <p style="text-align:center;color:var(--gray-500);margin-bottom:32px;">Choose a new password for your account.</p>

      <div id="resetAlert" class="alert hidden"></div>

      <form id="resetForm" class="panel" style="padding:32px;">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" required minlength="8">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const alertBox = document.getElementById('resetAlert');

    if (!token) {
      alertBox.className = 'alert alert-error';
      alertBox.textContent = 'No reset token found. Please use the link from your email.';
      alertBox.classList.remove('hidden');
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = 'Passwords do not match.';
        alertBox.classList.remove('hidden');
        return;
      }

      try {
        const res = await api.post('/api/password/reset', { token, newPassword });
        alertBox.className = 'alert alert-success';
        alertBox.textContent = res.message;
        alertBox.classList.remove('hidden');
        setTimeout(() => window.location.href = '/login.html', 2000);
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message || 'Could not reset password.';
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
