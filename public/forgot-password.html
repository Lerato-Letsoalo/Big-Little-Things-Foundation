<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Big Little Things Foundation</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="header-mount"></div>

  <main class="container" style="padding-top:80px;padding-bottom:80px;">
    <div style="max-width:440px;margin:0 auto;">
      <h1 class="section-title" style="font-size:2rem;margin-bottom:8px;">Forgot <em>Password</em></h1>
      <p style="text-align:center;color:var(--gray-500);margin-bottom:32px;">Enter your email and we'll send you a reset link.</p>

      <div id="resetAlert" class="alert hidden"></div>

      <form id="forgotForm" class="panel" style="padding:32px;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:0.9rem;">
        <a href="/login.html" style="color:var(--red);">Back to login</a>
      </p>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('resetAlert');
      const email = document.getElementById('email').value.trim();
      try {
        const res = await api.post('/api/password/forgot', { email });
        alertBox.className = 'alert alert-success';
        alertBox.textContent = res.message;
        alertBox.classList.remove('hidden');
        e.target.reset();
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message || 'Could not send reset link.';
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
